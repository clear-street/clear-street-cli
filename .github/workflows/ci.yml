name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/clear-street/clear-street-go,github.com/stainless-sdks/clear-street-go

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Go SDK token
        if: startsWith(github.repository, 'clear-street-internal/') || startsWith(github.repository, 'clear-street/')
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository == 'clear-street-internal/clear-street-active-cli-staging' && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=${HOME}/.gitconfig" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/clear-street-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/clear-street-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Go SDK token
        if: startsWith(github.repository, 'clear-street-internal/') || startsWith(github.repository, 'clear-street/')
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository == 'clear-street-internal/clear-street-active-cli-staging' && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=${HOME}/.gitconfig" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/clear-street-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/clear-street-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'stainless-sdks/clear-street-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Upload tarball
        if: |-
          github.repository == 'stainless-sdks/clear-street-cli' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
        run: ./scripts/utils/upload-artifact.sh

  test:
    timeout-minutes: 10
    name: test
    runs-on: ${{ startsWith(github.repository, 'stainless-sdks/') && 'depot-ubuntu-24.04' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Go SDK token
        if: startsWith(github.repository, 'clear-street-internal/') || startsWith(github.repository, 'clear-street/')
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.repository == 'clear-street-internal/clear-street-active-cli-staging' && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "GIT_CONFIG_GLOBAL=${HOME}/.gitconfig" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: github.repository == 'stainless-sdks/clear-street-cli'
        run: |
          ./scripts/link 'github.com/stainless-sdks/clear-street-go@${{ github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
