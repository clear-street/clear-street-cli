name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

env:
  GOPRIVATE: github.com/clear-street/clear-street-go,github.com/clear-street-internal/clear-street-active-go-staging

jobs:
  lint:
    timeout-minutes: 10
    name: lint
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate Go SDK token
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ startsWith(github.repository, 'clear-street-internal/') && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: startsWith(github.repository, 'clear-street-internal/')
        run: |
          ./scripts/link 'github.com/clear-street-internal/clear-street-active-go-staging@${{ github.head_ref || github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run lints
        run: ./scripts/lint

  build:
    timeout-minutes: 10
    name: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event.pull_request.head.repo.fork) && (github.event_name != 'push' || github.event.head_commit.message != 'codegen metadata')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate Go SDK token
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ startsWith(github.repository, 'clear-street-internal/') && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: startsWith(github.repository, 'clear-street-internal/')
        run: |
          ./scripts/link 'github.com/clear-street-internal/clear-street-active-go-staging@${{ github.head_ref || github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9ed2f89a662bf1735a48bc8557fd212fa902bebf # v6.1.0
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    timeout-minutes: 10
    name: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Generate Go SDK token
        id: go-sdk-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_CLIENT_ID || secrets.STLC_CLIENT_ID_PROD }}
          private-key: ${{ startsWith(github.repository, 'clear-street-internal/') && secrets.STLC_PRIVATE_KEY || secrets.STLC_CLIENT_PRIVATE_KEY_PROD }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ startsWith(github.repository, 'clear-street-internal/') && 'clear-street-active-go-staging' || 'clear-street-go' }}

      - name: Authenticate git for the Go SDK repo
        if: steps.go-sdk-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.go-sdk-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: ./.github/actions/setup-go

      - name: Link staging branch
        if: startsWith(github.repository, 'clear-street-internal/')
        run: |
          ./scripts/link 'github.com/clear-street-internal/clear-street-active-go-staging@${{ github.head_ref || github.ref_name }}' || true

      - name: Bootstrap
        run: ./scripts/bootstrap

      - name: Run tests
        run: ./scripts/test
